# Render Blueprint for Doomsday Ready Full-Stack Application
# Automatically configures PostgreSQL Database, Node.js Backend API, and React Frontend

databases:
  - name: doomsday-db
    databaseName: doomsday_db
    user: doomsday_user
    plan: free

services:
  # 1. Backend Web Service (Node.js + Express + Prisma)
  - type: web
    name: doomsday-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doomsday-db
          property: connectionString
      - key: PORT
        value: 5000

  # 2. Frontend Static Site (React + Vite + Tailwind CSS)
  - type: web
    name: doomsday-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: doomsday-backend
          property: host
